<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Council</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="topbar">
    <div id="title">
      Council <span id="councilDot" class="dot red"></span>
    </div>
    <div id="seatStatusLabel">Active Seat: —</div>
    <div id="optionsBtn">⚙️</div>
  </div>

  <div id="chat">
    <div id="left" class="column left"></div>
    <div id="right" class="column right"></div>
  </div>

  <div id="hudButtons">
    <button id="toggleLogs" type="button">Logs</button>
    <button id="exportLog" type="button">Export Log</button>
    <div id="hud-container">
      <button id="hud-toggle" type="button">▲</button>
      <div id="hud-panel">
        <span id="hud-text">Seat: Idle — Entropy 0.00 — RAM 0.0% — Models: —</span>
      </div>
    </div>
  </div>
  <div id="seatStatus" class="seat-panel"></div>
  <div id="councilLogs" class="council-logs"></div>

  <div id="inputBar">
    <input id="seedInput" type="text" placeholder="Enter a topic or question..." />
    <button id="startSessionBtn">Start Session</button>
    <button id="sendBtn">Send</button>
  </div>

  <script src="options.js" type="module"></script>
  <script src="app.js" type="module"></script>
  <script src="hud.js" type="module"></script>
  <script src="console.js" type="module"></script>
</body>
</html>
