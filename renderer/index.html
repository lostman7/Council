<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Council</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="topbar">
    <div id="title">
      Council <span id="councilDot" class="dot red"></span>
    </div>
    <div id="seatStatus">Active Seat: —</div>
    <div id="optionsBtn">⚙️</div>
  </div>

  <div id="chat">
    <div id="left" class="column left"></div>
    <div id="right" class="column right"></div>
  </div>

  <div id="logWindow" class="log-window">
    <div class="log-header">Council Logs</div>
    <div id="logContent" class="log-content"></div>
  </div>

  <div id="inputBar">
    <input id="seedInput" type="text" placeholder="Enter a topic or question..." />
    <button id="startSessionBtn">Start Session</button>
    <button id="sendBtn">Send</button>
  </div>

  <script src="options.js" type="module"></script>
  <script src="app.js" type="module"></script>
  <script src="hud.js" type="module"></script>
</body>
</html>
